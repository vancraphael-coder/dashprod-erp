<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- =====================================================================
         RÉFÉRENCEMENT
         Un seul domaine à changer si besoin : dashprod.com → ton domaine réel,
         ici et dans public/robots.txt + public/sitemap.xml.
         ===================================================================== -->
    <title>Dashprod — le logiciel des entreprises de déménagement</title>
    <meta name="description"
          content="Dashprod gère votre entreprise de déménagement de bout en bout : devis, planning, chantiers, facturation et suivi client. Conçu pour la Belgique." />
    <link rel="canonical" href="https://dashprod.com/" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/dashprod-marque.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Aperçu quand le lien est partagé (WhatsApp, LinkedIn, Messenger…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dashprod" />
    <meta property="og:title" content="Dashprod — le logiciel des entreprises de déménagement" />
    <meta property="og:description"
          content="Du premier appel à la facture payée. Devis, planning, chantiers et facturation, en un seul outil." />
    <meta property="og:url" content="https://dashprod.com/" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:image" content="https://dashprod.com/partage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      /*
        AUCUN BLANC SUR LES CÔTÉS.
        Sur un téléphone étroit, il suffit d'UN élément plus large que l'écran
        (une colonne de grille à largeur fixe, une image, un mot insécable)
        pour que la page devienne défilable horizontalement : le fond de la
        page s'arrête alors à la largeur de l'écran et laisse une bande claire
        sur la droite. La cause est corrigée à la source (les grilles utilisent
        `minmax(min(Npx, 100%), 1fr)`), ces règles sont la ceinture de sécurité.
      */
      html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
      img, svg, video, canvas { max-width: 100%; height: auto; }
      html, body { margin: 0; background: #F1F5FB; }
      /* iOS zoome les champs sous 16px : on impose 16 pour éviter le saut. */
      input, select, textarea { font-family: system-ui, sans-serif; font-size: 16px; color: #0F172A; }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: #2563EB !important;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
      }

      /*
        IMPRESSION — seul le contrat part sur le papier / le PDF.
        Tout le reste de l'application (barres, boutons, preuve d'intégrité)
        est masqué : le client ne doit recevoir QUE son document.
        Utilisé par le bouton « Imprimer / Enregistrer en PDF » (window.print).
      */
      @media print {
        body * { visibility: hidden !important; }
        .contrat-imprimable, .contrat-imprimable * { visibility: visible !important; }
        .contrat-imprimable {
          position: absolute !important; left: 0; top: 0; width: 100% !important;
          margin: 0 !important; border: none !important;
          box-shadow: none !important; border-radius: 0 !important;
        }
        .no-print { display: none !important; }
        @page { margin: 12mm; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
